<body>

  <div id="header-placeholder"></div>
  <canvas id="bgCanvas"></canvas>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-prev" id="lbPrev">←</button>
    <button class="lb-next" id="lbNext">→</button>
    <div class="lb-inner">
      <div class="lb-media-wrap" id="lbMediaWrap">
        <div class="lb-img-wrap" id="lbImgWrap">
          <img id="lbImg" src="" alt="">
        </div>
        <div class="lb-video-wrap" id="lbVideoWrap" style="display:none">
          <video id="lbVideo" playsinline></video>
          <div class="vp-big-play" id="vpBigPlay">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
          <div class="vp-controls">
            <div class="vp-progress" id="vpProgress">
              <div class="vp-progress-fill" id="vpFill"></div>
            </div>
            <div class="vp-bottom">
              <button class="vp-btn" id="vpPlayBtn">
                <svg id="vpPlayIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
              </button>
              <span class="vp-time" id="vpTime">0:00 / 0:00</span>
              <div class="vp-vol-wrap">
                <button class="vp-btn" id="vpMuteBtn">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                  </svg>
                </button>
                <input type="range" class="vp-vol-slider" id="vpVol" min="0" max="1" step="0.05" value="1">
              </div>
              <button class="vp-btn" id="vpFullBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
                  <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="lb-info">
        <span class="lb-cat" id="lbCat"></span>
        <h2 class="lb-title" id="lbTitle"></h2>
        <p class="lb-desc" id="lbDesc"></p>
        <div class="lb-tags" id="lbTags"></div>
        <span class="lb-year" id="lbYear"></span>
      </div>
    </div>
  </div>

  <main id="main">
  <div data-scroll-container>
    <!-- HERO -->
    <section id="port-hero">
      <div class="port-hero-inner">
        <p class="section-eyebrow port-eyebrow">// portfolyo</p>
        <h1 class="port-hero-title">
          <span class="port-line">TÜM</span>
          <span class="port-line port-line--outline">İŞLER</span>
        </h1>
        <p class="port-hero-sub">
          2015'ten bugüne üretilmiş seçilmiş işler.
          Web, animasyon, video ve grafik.
        </p>
      </div>
    </section>

    <!-- FİLTRE + GALERİ -->
    <section id="port-gallery">
      <div class="port-gallery-inner">

        <div class="port-filters">
          <button class="filter-btn active" data-filter="all">
            Tümü <span class="filter-count" id="fc-all">–</span>
          </button>
          <button class="filter-btn" data-filter="web">
            Web <span class="filter-count" id="fc-web">–</span>
          </button>
          <button class="filter-btn" data-filter="3d">
            3D <span class="filter-count" id="fc-3d">–</span>
          </button>
          <button class="filter-btn" data-filter="2d">
            2D <span class="filter-count" id="fc-2d">–</span>
          </button>
          <button class="filter-btn" data-filter="video">
            Video <span class="filter-count" id="fc-video">–</span>
          </button>
          <button class="filter-btn" data-filter="graphic">
            Grafik <span class="filter-count" id="fc-graphic">–</span>
          </button>
        </div>

        <div class="port-grid" id="portGrid">
          <div class="port-loading" role="status">İşler yükleniyor…</div>
        </div>

        <div class="port-empty" id="portEmpty" style="display:none">
          <span>Bu kategoride henüz iş yok.</span>
        </div>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  </div><!-- /data-scroll-container -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

      const s = document.createElement('script');
      s.src = 'assets/js/main.js?v=5';
      s.onload = () => {
        const pageJs = document.createElement('script');
        pageJs.src = 'assets/js/portfolio.js?v=5';
        document.body.appendChild(pageJs);
      };
      document.body.appendChild(s);
    });
  </script>
  <script src="assets/js/transitions.js?v=3" defer></script>
