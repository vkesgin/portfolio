name = "vk-portfolio-api"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vk-portfolio"
database_id = "d370fb24-6366-46ac-8406-554d22de25be"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "vk-portfolio-files"

[vars]
ALLOWED_ORIGIN = "https://velikesgin.com"
# Owner/admin tokens issued before this time are rejected (KPSS owner, portfolio admin, inspire admin); "" = off.
# ISO date-time, e.g. "2026-10-06T12:00:00Z". Set it to the moment ADMIN_PASSWORD was rotated (see index.js ownerTokenRevoked).
ADMIN_TOKENS_NOT_BEFORE = "2026-10-06T06:16:00Z"
# AI storyboards (worker/storyboard/). Rollout: deploy with SB_ENABLED="0" first; then "1" with SB_ADMIN_ONLY="1";
# then SB_ADMIN_ONLY="0" opens it to guests. [vars] are overwritten from this file on every deploy.
# Always run wrangler from worker/ WITH -c wrangler.toml (e.g. `npx wrangler deploy -c wrangler.toml`): without it,
# wrangler 4 resolves the repo-root wrangler.jsonc (the static "portfolio" site) even from inside worker/.
SB_ENABLED = "1"              # "1" turns creation and edits on (viewing works regardless)
SB_ADMIN_ONLY = "0"           # "0" opens creation/edits to guests and users
SB_DAILY_LIMIT = "12"         # storyboards per UTC day, everyone together (admin included)
SB_PER_CID_LIMIT = "3"        # per guest cid / registered user per day (admin exempt)
SB_PER_IP_LIMIT = "6"         # per hashed IP per day (admin exempt; "0" = off)
SB_DAILY_FRAME_REGEN = "40"   # frame regeneration units per day, everyone together
SB_PER_CID_FRAME_REGEN = "15" # frame regeneration units per cid/user per day (admin exempt)
SB_NEURON_BUDGET = "9000"     # daily cap on ledgered neurons + reservations of running jobs (10,000/day free allocation)
SB_TAVILY_MONTHLY = "900"     # Tavily credits per calendar month (free plan: 1,000)
SB_TAVILY_MAX_QUERIES = "3"
SB_FRAME_CONCURRENCY = "3"
SB_STALE_MIN = "15"
# Fikir Havuzu media previews (worker/inspire-media.js). Rollout: deploy with FIKIR_BR="0" + FIKIR_MEDIA_UPLOADS="admin";
# then FIKIR_MEDIA_UPLOADS="all" after the owner checks; then FIKIR_BR="1" after the production check of Browser Run usage.
FIKIR_BR = "1"                 # "1" enables the Browser Run fallback (rollout step 3)
FIKIR_BR_DAILY = "100"         # Browser Run calls per UTC day, whole site
FIKIR_BR_MS_DAILY = "300000"   # browser ms per UTC day (Free allowance 600000)
FIKIR_BR_PER_CID = "15"        # per post author (guest cid / user) per UTC day, charged when the author asks (admin exempt)
FIKIR_BR_PER_IP = "20"         # per requesting IP per UTC day (admin exempt; the cron is not charged)
FIKIR_BR_MS_PER_CID = "60000"  # browser ms per post author per UTC day (admin exempt)
FIKIR_BR_MS_PER_IP = "60000"   # browser ms per requesting IP per UTC day (admin exempt)
FIKIR_MEDIA_UPLOADS = "admin"  # off | admin | users | all
FIKIR_UP_PER_CID_N = "10"      # uploads per cid/user per UTC day (admin exempt from all upload caps but FIKIR_UP_TOTAL_MB)
FIKIR_UP_PER_CID_MB = "100"
FIKIR_UP_PER_IP_N = "20"       # uploads per IP per UTC day (guest cids are client-chosen)
FIKIR_UP_PER_IP_MB = "200"
FIKIR_UP_DAILY_MB = "1000"     # all guest/user uploads per UTC day
FIKIR_UP_TOTAL_MB = "6000"     # all live board files (uploads + R2 copies) together, checked before every write; R2 Free = 10 GB.
# R2 copies, estimate (2026-10-09): the board had 95 posts on 2026-10-08 (78 Instagram: 19 /reel/ + 59 /p/, 8 Pinterest pins,
# 3 YouTube never copied, the rest text / links). Copies measured: Instagram reels 1.5-20 MB (mean ~7 MB, median ~6 MB),
# TikTok 2.7 MB, X 7.8 MB (47 s), Reddit 4.2 MB (16 s, picture + sound joined), posters 0.05-0.3 MB. Upper bound for the
# current board (every Instagram post a video): 78 x ~7 MB + a few pins ~ 0.6 GB (the 5 blocked reels already copied: ~40 MB;
# /p/ photos and image pins copy nothing). New video posts add ~3-8 MB each (40 MB cap per copy): 6000 MB leaves room for
# ~800+ more. R2 operations: 2 writes per copy; plays are range reads (Free: 1M writes / 10M reads a month, no egress fee).
# Downloads + R2 copies of video posts (worker/inspire-video.js): GET /api/inspire/posts/:id/download, POST .../copy (cards in
# view), POST .../ig-copy, cron "7-59/15". A copy plays on the board as our player + caption + "@user · Platform".
FIKIR_DL = "1"                 # "0" turns the download links off
FIKIR_DL_DAILY = "1500"        # downloads that fetch from elsewhere per UTC day, whole site (our R2 copies/uploads and the
                               # admin's ticketed links do not count; plus 40 per IP / 10 min in code)
FIKIR_DL_MAX_MB = "200"        # largest file a download streams through
FIKIR_IG_COPY = "1"            # "0" turns R2 copies of Instagram videos off (routes and cron)
FIKIR_IG_AUTO = "all"          # Instagram copies without anyone asking (cron + cards in view): off | blocked (reels whose embed shows
                               # "Instagram'da İzle") | all (every Instagram video post, /p/ and /tv/ links too, blocked first; photos drop out)
FIKIR_COPY_ADAPTERS = "x,pinterest,tiktok,facebook,reddit"   # other platforms whose video posts are copied (cron + cards in view),
                               # through the download adapters (each must also be in FIKIR_DL_ADAPTERS); "" = Instagram only
FIKIR_IG_COPY_DAILY = "150"    # R2 copies per UTC day, every platform: cron + cards in view + requests (guests' requests together at most
                               # half; admin exempt). Bytes count into FIKIR_UP_DAILY_MB (not the admin's) and FIKIR_UP_TOTAL_MB; a
                               # guest's requested copies also into FIKIR_UP_PER_CID_* / _PER_IP_*
FIKIR_IG_COPY_MB = "40"        # largest video copied (any platform; a Reddit video is measured after joining picture + sound)
FIKIR_COPY_VIEW = "1"          # "1": a card in view asks for its post's copy (POST .../copy, any board session); "0" off
FIKIR_COPY_VIEW_DAILY = "100"  # on-view copies per UTC day, whole site (inside FIKIR_IG_COPY_DAILY; admin exempt)
FIKIR_COPY_VIEW_PER_SESSION = "20"   # ... per guest cid / user per UTC day (plus 60 requests / hour in code)
FIKIR_COPY_VIEW_PER_IP = "40"  # ... per IP per UTC day (plus 120 requests / hour in code)
FIKIR_IG_FETCH_DAILY = "300"   # Instagram page + embed fetches by the worker per UTC day (plus 20 per 10 min in code)
FIKIR_IG_CRON_COPIES = "2"     # copies per "7-59/15" cron run (every 15 min, any platform; each also gated by the run's D1/subrequest
                               # budget: a second copy never uses Browser Run and starts only when its worst case still fits)
FIKIR_IG_CRON_CHECKS = "2"     # Instagram embed checks per cron run (same gate)
FIKIR_DL_ADAPTERS = "x,pinterest,tiktok,facebook,reddit"   # platforms whose videos downloads resolve (drop one to turn it off; YouTube/Vimeo cannot be downloaded)
FIKIR_DL_AD_DAILY = "400"      # platform page/API fetches for downloads + copies per UTC day (plus 20 per platform / 10 min in code)
# Board password gate (worker/fikir-gate.js): every /api/inspire/* route but GET /config, POST /guest and POST /login needs
# a session; guests get one with the secret FIKIR_BOARD_PASSWORD. The board's R2 files (/files/fikir/*, /files/sb/*) need
# the files token (?t=) the API appends for a session; "0" serves them public by unguessable URL again (rollback switch).
FIKIR_FILES_GATE = "1"
# Never set in production: INSPIRE_TEST_FETCH_ALLOW, INSPIRE_FAKE_BR (test-only: wrangler.mediatest.toml).
# Never set in production: SB_FAKE_AI, SB_FAKE_TAVILY, SB_FAKE_DELAY_MS, SB_FAKE_FAIL (test-only: wrangler.sbtest.toml).
# Secrets (never in [vars], never in the repo): JWT_SECRET, ADMIN_PASSWORD, TAVILY_API_KEY, FIKIR_BOARD_PASSWORD.
#   FIKIR_BOARD_PASSWORD  the shared board password for guests (anonymous ones too). Missing = the board is locked for
#                         guests (POST /guest -> 503 board_locked, every guest token rejected); the admin login still works.
#                         Changing it logs every guest out (their tokens carry its version `pv`).
# To set / rotate one, from worker/ (the value is typed at the prompt, never on the command line):
#   npx wrangler secret put FIKIR_BOARD_PASSWORD -c wrangler.toml     (without -c it lands on the static "portfolio" worker)
#   npx wrangler secret put TAVILY_API_KEY -c wrangler.toml
# Local runs: worker/.dev.vars (git-ignored) holds TEST values only.

[ai]
binding = "AI"

[browser]
binding = "BROWSER"            # Browser Run (Free: 10 min/day). Used only as a fallback for pages whose plain fetch is blocked.

[[workflows]]
name = "vk-storyboard"              # account-unique, <= 64 chars
binding = "STORYBOARD_WF"           # env.STORYBOARD_WF
class_name = "StoryboardWorkflow"   # exported from index.js; same script, so no script_name

# scheduled() dispatches on controller.cron (worker/budget.js CRON_MAIN / CRON_IG); each trigger is its own invocation with
# its own Workers Free limits (50 D1 queries, 50 external subrequests, 10 ms CPU), and every run is metered to stay under
# 40 D1 statements / 35 subrequests (tests/cron-budget.test.mjs). Free allows 5 Cron Triggers per ACCOUNT: this worker uses 2.
#   "*/15 * * * *"     stale storyboard jobs, orphan sweep, quota/ledger/rate pruning, upload cleanup, link-preview Browser Run retries
#   "7-59/15 * * * *"  R2 copies of video posts (FIKIR_IG_AUTO, FIKIR_COPY_ADAPTERS) + Instagram embed checks, minutes 7/22/37/52
[triggers]
crons = ["*/15 * * * *", "7-59/15 * * * *"]
