name = "vk-portfolio-api"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vk-portfolio"
database_id = "d370fb24-6366-46ac-8406-554d22de25be"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "vk-portfolio-files"

[vars]
ALLOWED_ORIGIN = "https://velikesgin.com"
ADMIN_PASSWORD = "2169095vV."
# AI storyboards (worker/storyboard/). Rollout: deploy with SB_ENABLED="0" first; then "1" with SB_ADMIN_ONLY="1";
# then SB_ADMIN_ONLY="0" opens it to guests. [vars] are overwritten from this file on every deploy.
SB_ENABLED = "0"              # "1" turns creation and edits on (viewing works regardless)
SB_ADMIN_ONLY = "1"           # "0" opens creation/edits to guests and users
SB_DAILY_LIMIT = "12"         # storyboards per UTC day, everyone together (admin included)
SB_PER_CID_LIMIT = "3"        # per guest cid / registered user per day (admin exempt)
SB_PER_IP_LIMIT = "6"         # per hashed IP per day (admin exempt; "0" = off)
SB_DAILY_FRAME_REGEN = "40"   # frame regeneration units per day, everyone together
SB_PER_CID_FRAME_REGEN = "15" # frame regeneration units per cid/user per day (admin exempt)
SB_NEURON_BUDGET = "9000"     # soft ceiling under the 10,000 neurons/day Workers AI free allocation
SB_TAVILY_MONTHLY = "900"     # Tavily credits per calendar month (free plan: 1,000)
SB_TAVILY_MAX_QUERIES = "3"
SB_FRAME_CONCURRENCY = "3"
SB_STALE_MIN = "15"
# Never set in production: SB_FAKE_AI, SB_FAKE_TAVILY, SB_FAKE_DELAY_MS, SB_FAKE_FAIL (test-only: wrangler.sbtest.toml).
# Secret (never in [vars]): TAVILY_API_KEY via `npx wrangler secret put TAVILY_API_KEY` (already set in production).

[ai]
binding = "AI"

[[workflows]]
name = "vk-storyboard"              # account-unique, <= 64 chars
binding = "STORYBOARD_WF"           # env.STORYBOARD_WF
class_name = "StoryboardWorkflow"   # exported from index.js; same script, so no script_name

[triggers]
crons = ["*/15 * * * *"]            # scheduled(): stale storyboard jobs, orphan sweep, quota/ledger pruning
